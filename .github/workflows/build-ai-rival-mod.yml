name: Build AI Rival mod

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the built mod (tag = version in mod.json)"
        type: boolean
        default: false
  push:
    paths:
      - "gd-ai-rival/mod/**"
      - ".github/workflows/build-ai-rival-mod.yml"

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]

    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gd-ai-rival/mod
          combine: true
          target: ${{ matrix.target }}

  windows:
    # Windows runners check out into D:\a\<repo>\<repo>, and Windows can't
    # create folders whose name ends in ".", so this job can only run once
    # the repository is renamed (e.g. "my-project." -> "my-project").
    if: ${{ !endsWith(github.repository, '.') }}
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gd-ai-rival/mod
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [android, windows]
    if: ${{ !cancelled() && needs.android.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: AI Rival mod
          path: ${{ steps.build.outputs.build-output }}

      # Release: run this workflow by hand with "release" ticked
      - uses: actions/checkout@v7
        if: ${{ inputs.release }}
        with:
          path: src

      - name: Prepare release notes
        id: notes
        if: ${{ inputs.release }}
        run: |
          version=$(jq -r .version src/gd-ai-rival/mod/mod.json)
          geode=$(jq -r .geode src/gd-ai-rival/mod/mod.json)
          gd=$(jq -r .gd.android src/gd-ai-rival/mod/mod.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "For **Geometry Dash $gd** with **Geode $geode**, on Android and Windows."
            echo
            echo "### Install"
            echo "1. Download **marun1105.ai-rival.geode** below."
            echo "2. Put it in Geode's \`mods\` folder: on Windows \`<GD folder>/geode/mods\`, on Android \`Android/media/com.geode.launcher/game/geode/mods\`."
            echo "3. Restart the game, open the mod's settings and press **Set Up** under AI Connection."
            echo
            echo "### Changes"
            awk '/^# /{n++; next} n==1' src/gd-ai-rival/mod/changelog.md
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.release }}
        with:
          tag_name: ${{ steps.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AI Rival ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.build.outputs.build-output }}/*.geode
          make_latest: true
