name: Build AI Rival mod

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub release with the built mod (tag = version in mod.json)"
        type: boolean
        default: false
  push:
    paths:
      - "gd-ai-rival/mod/**"
      - ".github/workflows/build-ai-rival-mod.yml"

jobs:
  android:
    strategy:
      fail-fast: false
      matrix:
        target: [Android32, Android64]

    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gd-ai-rival/mod
          combine: true
          target: ${{ matrix.target }}

  windows:
    # Windows runners check out into D:\a\<repo>\<repo>, and Windows can't
    # create folders whose name ends in ".", so this job can only run once
    # the repository is renamed (e.g. "my-project." -> "my-project").
    if: ${{ !endsWith(github.repository, '.') }}
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          path: gd-ai-rival/mod
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: [android, windows]
    if: ${{ !cancelled() && needs.android.result == 'success' && (needs.windows.result == 'success' || needs.windows.result == 'skipped') }}
    permissions:
      contents: write

    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: AI Rival mod
          path: ${{ steps.build.outputs.build-output }}

      # Release: run this workflow by hand with "release" ticked
      - uses: actions/checkout@v7
        if: ${{ inputs.release }}
        with:
          path: src

      - name: Prepare release notes
        id: notes
        if: ${{ inputs.release }}
        run: |
          mod=src/gd-ai-rival/mod
          version=$(jq -r .version $mod/mod.json)
          geode=$(jq -r .geode $mod/mod.json)
          gd=$(jq -r .gd.android $mod/mod.json)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          {
            echo "**AI Rival** is an AI companion for Geometry Dash. It watches your attempts, reacts to deaths, new bests and completions in a speech bubble, and lets you chat with it without leaving the level. It runs on your own API key, with free options available."
            echo
            echo "### Compatibility"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Geometry Dash | $gd |"
            echo "| Geode | $geode |"
            echo "| Platforms | Android, Windows |"
            echo
            echo "### Installation"
            echo
            echo "1. Download **\`marun1105.ai-rival.geode\`** from the assets below."
            echo "2. Copy it into Geode's mods folder:"
            echo "   - **Windows:** \`<Geometry Dash folder>/geode/mods\`"
            echo "   - **Android:** \`Android/media/com.geode.launcher/game/geode/mods\`"
            echo "3. Restart Geometry Dash, open the mod's settings and select **Set Up** under *AI Connection*."
            echo
            echo "### What's new"
            echo
            awk '/^# /{n++; next} n==1 && NF' $mod/changelog.md
            echo
            echo "### Privacy and usage"
            echo
            echo "Your API key is stored only on your device and is sent only to the provider you choose. A daily message limit, set to 200 by default, keeps usage and cost under control."
          } > release-notes.md

      - uses: softprops/action-gh-release@v2
        if: ${{ inputs.release }}
        with:
          tag_name: ${{ steps.notes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: AI Rival ${{ steps.notes.outputs.version }}
          body_path: release-notes.md
          files: ${{ steps.build.outputs.build-output }}/*.geode
          make_latest: true
