<svg xmlns="http://www.w3.org/2000/svg" width="336" height="336" viewBox="0 0 336 336">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b3cff"/>
      <stop offset="1" stop-color="#14b8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.35" cy="0.7" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe45c"/>
      <stop offset="1" stop-color="#ffb21e"/>
    </linearGradient>
    <linearGradient id="cubeInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4df2ff"/>
      <stop offset="1" stop-color="#18b6ff"/>
    </linearGradient>
  </defs>

  <!-- background tile -->
  <rect x="8" y="8" width="320" height="320" rx="64" fill="url(#bg)"/>
  <rect x="8" y="8" width="320" height="320" rx="64" fill="url(#glow)"/>
  <!-- subtle speed stripes, a nod to GD's motion -->
  <g opacity="0.12" fill="#ffffff">
    <rect x="-40" y="250" width="260" height="14" rx="7" transform="rotate(-20 168 168)"/>
    <rect x="-20" y="282" width="200" height="10" rx="5" transform="rotate(-20 168 168)"/>
  </g>

  <!-- GD cube with a smirk -->
  <g transform="translate(40 128)">
    <rect x="0" y="0" width="156" height="156" rx="18" fill="#1a1033"/>
    <rect x="10" y="10" width="136" height="136" rx="12" fill="url(#cube)"/>
    <rect x="34" y="34" width="88" height="88" rx="8" fill="#1a1033"/>
    <rect x="42" y="42" width="72" height="72" rx="5" fill="url(#cubeInner)"/>
    <!-- eyes: one squinting, rival attitude -->
    <rect x="54" y="58" width="18" height="20" rx="3" fill="#1a1033"/>
    <rect x="84" y="64" width="20" height="8" rx="3" fill="#1a1033"/>
    <!-- cocky eyebrow over the open eye -->
    <path d="M50 50 L76 55" stroke="#1a1033" stroke-width="6" stroke-linecap="round"/>
    <!-- smirk -->
    <path d="M58 92 Q82 104 102 86" stroke="#1a1033" stroke-width="7" fill="none" stroke-linecap="round"/>
  </g>

  <!-- speech bubble with "AI" -->
  <g transform="translate(150 46)">
    <path d="M24 0 H136 Q160 0 160 24 V82 Q160 106 136 106 H74 L40 140 L46 106 H24 Q0 106 0 82 V24 Q0 0 24 0 Z"
          fill="#ffffff" stroke="#1a1033" stroke-width="9" stroke-linejoin="round"/>
    <!-- letter A -->
    <path d="M38 84 L62 22 H78 L102 84 H84 L79 70 H61 L56 84 Z M65 57 H75 L70 41 Z" fill="#7b3cff"/>
    <!-- letter I -->
    <rect x="110" y="22" width="18" height="62" rx="3" fill="#14b8ff"/>
  </g>
</svg>
