<!doctype html>
<html>
<head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body>
<canvas id="c"></canvas>
<script>
// Grin, sculpted with signed distance fields and ray-marched: a tall, gaunt,
// hunched creature with ashen skin, sunken burning eyes, no nose, and a
// clenched grin stretched far too wide. An original design.
const FRAG = `#version 300 es
precision highp float;
out vec4 frag;
uniform vec2 uRes;
uniform vec3 uCam;
uniform vec3 uTarget;
uniform float uFov;
uniform float uRoar;
uniform float uTilt;
uniform float uPose;

const vec3 HEAD = vec3(0.0, 1.62, 0.12);

float smin(float a, float b, float k) { float h = max(k - abs(a - b), 0.0) / k; return min(a, b) - h * h * k * 0.25; }
float smax(float a, float b, float k) { return -smin(-a, -b, k); }
float sdEllipsoid(vec3 p, vec3 r) { float k0 = length(p / r); float k1 = length(p / (r * r)); return k0 * (k0 - 1.0) / k1; }
float sdCapsule(vec3 p, vec3 a, vec3 b, float r) { vec3 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0.0, 1.0); return length(pa - ba * h) - r; }
float sdRoundCone(vec3 p, vec3 a, vec3 b, float r1, float r2) {
  vec3 ba = b - a; float l2 = dot(ba, ba); float rr = r1 - r2; float a2 = l2 - rr * rr; float il2 = 1.0 / l2;
  vec3 pa = p - a; float y = dot(pa, ba); float z = y - l2;
  vec3 xv = pa * l2 - ba * y; float x2 = dot(xv, xv); float y2 = y * y * l2; float z2 = z * z * l2;
  float k = sign(rr) * rr * rr * x2;
  if (sign(z) * a2 * z2 > k) return sqrt(x2 + z2) * il2 - r2;
  if (sign(y) * a2 * y2 < k) return sqrt(x2 + y2) * il2 - r1;
  return (sqrt(x2 * a2 * il2) + y * rr) * il2 - r1;
}
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
mat2 rot(float a) { float c = cos(a), s = sin(a); return mat2(c, -s, s, c); }
float hash(vec3 p) { p = fract(p * 0.3183099 + 0.1); p *= 17.0; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float noise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(mix(hash(i), hash(i + vec3(1, 0, 0)), f.x), mix(hash(i + vec3(0, 1, 0)), hash(i + vec3(1, 1, 0)), f.x), f.y),
             mix(mix(hash(i + vec3(0, 0, 1)), hash(i + vec3(1, 0, 1)), f.x), mix(hash(i + vec3(0, 1, 1)), hash(i + vec3(1, 1, 1)), f.x), f.y), f.z);
}

// ---- the face ----
float mouthY(float x) { return -0.19 + 1.55 * x * x; }
float mouthH(float x) { float w = clamp(1.0 - pow(x / 0.32, 2.0), 0.0, 1.0); return mix(0.03, 0.095, uRoar) * w + 0.004; }
float faceZ(float x) { return 0.37 - 1.05 * x * x; }

// Head in its own tilted frame. Returns distance, material in y
// (1 skin, 2 teeth, 3 eye, 4 mouth, 5 socket)
vec2 head(vec3 p, vec3 headPos, out float eyeDist) {
  vec3 q = p - headPos;
  q.xy = rot(uTilt) * q.xy;
  q.yz = rot(-0.12) * q.yz;

  // Skull: high cranium, narrow jaw, pointed chin, hollow temples
  float d = sdEllipsoid(q - vec3(0.0, 0.12, -0.05), vec3(0.33, 0.46, 0.4));
  d = smin(d, sdEllipsoid(q - vec3(0.0, -0.16, 0.03), vec3(0.25, 0.26, 0.3)), 0.14);
  d = smin(d, sdEllipsoid(q - vec3(0.0, -0.42, 0.1), vec3(0.085, 0.11, 0.11)), 0.12);
  vec3 cq = vec3(abs(q.x), q.yz);
  d = smin(d, sdEllipsoid(cq - vec3(0.21, -0.01, 0.25), vec3(0.09, 0.055, 0.08)), 0.07);
  d = smax(d, -(length(cq - vec3(0.35, 0.1, 0.1)) - 0.09), 0.08);
  d = smax(d, -(length(cq - vec3(0.25, -0.16, 0.25)) - 0.085), 0.08);
  // Heavy brows sloping down into a scowl
  d = smin(d, sdCapsule(cq, vec3(0.25, 0.17, 0.27), vec3(0.04, 0.105, 0.37), 0.04), 0.06);

  // Deep sockets
  float socket = sdEllipsoid(cq - vec3(0.135, 0.045, 0.34), vec3(0.08, 0.06, 0.11));
  d = smax(d, -socket, 0.035);
  // Two thin slits instead of a nose
  d = smax(d, -sdCapsule(cq, vec3(0.022, -0.06, 0.4), vec3(0.03, -0.1, 0.39), 0.006), 0.01);

  // The grin: a slit stretched nearly ear to ear, lifted at the corners,
  // with rows of pointed teeth left standing in it (the teeth are the parts
  // of the slit that aren't carved away, so they sit exactly in the mouth)
  float my = mouthY(q.x), mh = mouthH(q.x);
  float slit2 = max(abs(q.y - my) - mh, abs(q.x) - 0.32);
  float s = 0.021;
  float cx = (floor(q.x / s) + 0.5) * s;
  float rnd = hash(vec3(cx * 91.0, 1.0, 2.0));
  float rnd2 = hash(vec3(cx * 57.0, 3.0, 1.0));
  float cmh = mouthH(cx), cmy = mouthY(cx);
  float reach = mix(0.95, 0.42, uRoar);
  float thU = cmh * reach * (0.85 + 0.3 * rnd) + 0.004;
  float thL = cmh * reach * (0.8 + 0.35 * rnd2) + 0.004;
  float topY = cmy + cmh, botY = cmy - cmh;
  float lean = (rnd2 - 0.5) * 0.004;
  float halfW = 0.0088;
  // Upper teeth narrow from the gum down to a point, lower ones point up
  float uFrac = clamp((q.y - (topY - thU)) / thU, 0.0, 1.0);
  float upper = max(abs(q.x - cx - lean * (1.0 - uFrac)) - halfW * (0.25 + 0.75 * uFrac), (topY - thU) - q.y);
  float lFrac = clamp(((botY + thL) - q.y) / thL, 0.0, 1.0);
  float lower = max(abs(q.x - cx + lean * (1.0 - lFrac)) - halfW * (0.25 + 0.75 * lFrac), q.y - (botY + thL));
  float teeth = abs(cx) < 0.3 ? min(upper, lower) : 1.0;
  float cut = max(max(slit2, -teeth), -0.02 - q.z);
  d = smax(d, -cut, 0.006);

  // Skin texture
  d += (noise(q * 34.0) - 0.5) * 0.004 + (noise(q * 9.0) - 0.5) * 0.006;

  vec2 res = vec2(d, 1.0);
  if (slit2 < 0.004 && q.z > 0.05) res.y = teeth < 0.0015 ? 2.0 : 4.0;
  if (socket < 0.01) res.y = 5.0;

  // Burning pupils deep in the sockets
  float eye = length(cq - vec3(0.135, 0.04, 0.3)) - mix(0.017, 0.022, uRoar);
  eyeDist = eye;
  if (eye < res.x) res = vec2(eye, 3.0);
  return res;
}

// ---- the body ----
float finger(vec3 p, vec3 a, vec3 dir, float len, float curl) {
  vec3 b = a + dir * len * 0.4;
  vec3 c = b + normalize(dir + vec3(0.0, -curl, 0.0)) * len * 0.35;
  vec3 e = c + normalize(dir + vec3(0.0, -curl * 2.2, 0.0)) * len * 0.3;
  float d = sdRoundCone(p, a, b, 0.017, 0.014);
  d = smin(d, sdRoundCone(p, b, c, 0.014, 0.011), 0.01);
  d = smin(d, sdRoundCone(p, c, e, 0.011, 0.002), 0.008);
  return d;
}

float hand(vec3 p, vec3 wrist, vec3 forward, vec3 side) {
  if (length(p - wrist) > 0.55) return length(p - wrist) - 0.45;
  float d = sdEllipsoid(p - wrist - forward * 0.05, vec3(0.06, 0.075, 0.035));
  for (int i = 0; i < 4; i++) {
    float f = float(i) - 1.5;
    vec3 base = wrist + forward * 0.1 + side * f * 0.032;
    vec3 dir = normalize(forward + side * f * 0.12);
    d = smin(d, finger(p, base, dir, 0.36 - abs(f) * 0.05, 0.35), 0.02);
  }
  d = smin(d, finger(p, wrist + side * -0.06 + forward * 0.03, normalize(forward - side * 0.8), 0.2, 0.2), 0.02);
  return d;
}

float limb(vec3 p, vec3 a, vec3 b, vec3 c, float r0, float r1, float r2) {
  float d = sdRoundCone(p, a, b, r0, r1);
  d = smin(d, sdRoundCone(p, b, c, r1 * 0.9, r2), 0.04);
  d = smin(d, length(p - b) - r1 * 1.15, 0.04);
  return d;
}

vec2 map(vec3 p, out float eyeDist) {
  eyeDist = 100.0;
  vec2 res = vec2(1e9, 1.0);
  // Full-body pose: hunched forward, head thrust out, both hands reaching
  vec3 headPos = mix(HEAD, vec3(0.0, 1.24, 0.74), uPose);
  float hb = length(p - headPos) - 0.62;
  if (hb < 0.1) res = head(p, headPos, eyeDist);
  else res.x = hb;

  float bodyBound = length(p - vec3(0.0, -0.1, 0.2)) - 2.4;
  if (bodyBound > 0.2) return vec2(min(res.x, bodyBound), res.y);

  // Neck with tendons
  float b = sdRoundCone(p, vec3(0.0, 0.7, 0.1 * uPose - 0.02), headPos + vec3(0.0, -0.32, -0.12), 0.09, 0.07);
  vec3 sp = vec3(abs(p.x), p.yz);
  b = smin(b, sdCapsule(sp, vec3(0.05, 0.75, 0.06 + 0.1 * uPose), vec3(0.03, headPos.y - 0.3, headPos.z + 0.02), 0.016), 0.03);
  // Gaunt, hunched torso
  vec3 tp = p - vec3(0.0, 0.42, 0.06 * uPose);
  tp.yz = rot(mix(0.38, 0.62, uPose)) * tp.yz;
  b = smin(b, sdEllipsoid(tp, vec3(mix(0.3, 0.24, uPose), mix(0.36, 0.32, uPose), 0.16)), 0.12);
  b = smin(b, sdRoundCone(p, vec3(0.0, 0.18, 0.06), vec3(0.0, -0.55, 0.02), 0.17, 0.12), 0.12);
  b = smin(b, sdEllipsoid(p - vec3(0.0, -0.72, 0.0), vec3(0.2, 0.14, 0.13)), 0.1);
  // Collarbones and bony shoulders
  b = smin(b, sdCapsule(sp, vec3(0.03, 0.7, 0.12), vec3(0.35, 0.68, 0.04), 0.028), 0.04);
  b = smin(b, length(sp - vec3(0.37, 0.64, 0.0)) - 0.085, 0.06);
  // Spine bumps down the back
  for (int i = 0; i < 6; i++) {
    float y = 0.7 - float(i) * 0.17;
    b = smin(b, length(p - vec3(0.0, y, -0.16 - 0.04 * sin(float(i)))) - 0.035, 0.05);
  }

  // One arm reaching at you, the other hanging far too low
  vec3 rShoulder = vec3(0.37, 0.64, 0.08 * uPose);
  vec3 rWrist = mix(vec3(0.46, 1.0, 1.2), vec3(0.42, 0.78, 2.2), uPose);
  b = smin(b, limb(p, rShoulder, mix(vec3(0.64, 0.24, 0.52), vec3(0.74, 0.42, 1.15), uPose), rWrist, 0.06, 0.045, 0.035), 0.05);
  b = smin(b, hand(p, rWrist, normalize(mix(vec3(0.05, 0.4, 1.0), vec3(-0.05, 0.1, 1.0), uPose)), vec3(1.0, 0.0, 0.0)), 0.03);
  vec3 lShoulder = vec3(-0.37, 0.64, 0.08 * uPose);
  vec3 lWrist = mix(vec3(-0.6, -0.95, 0.32), vec3(-0.36, 0.48, 2.05), uPose);
  b = smin(b, limb(p, lShoulder, mix(vec3(-0.56, -0.12, 0.18), vec3(-0.74, 0.18, 1.05), uPose), lWrist, 0.06, 0.045, 0.035), 0.05);
  b = smin(b, hand(p, lWrist, normalize(mix(vec3(-0.05, -1.0, 0.25), vec3(0.05, 0.0, 1.0), uPose)), vec3(-1.0, 0.0, 0.0)), 0.03);

  // Long legs, knees bent outwards
  b = smin(b, limb(sp, vec3(0.13, -0.78, 0.0), mix(vec3(0.4, -1.36, 0.32), vec3(0.42, -1.3, 0.75), uPose), vec3(0.34, -2.0, 0.12), 0.085, 0.06, 0.045), 0.06);
  b = smin(b, sdEllipsoid(sp - vec3(0.29, -2.05, 0.18), vec3(0.07, 0.045, 0.19)), 0.05);

  b += (noise(p * 30.0) - 0.5) * 0.004;
  if (b < res.x) res = vec2(b, 1.0);
  return res;
}

vec3 normalAt(vec3 p) {
  float e; const vec2 k = vec2(1.0, -1.0); const float h = 0.0006;
  return normalize(k.xyy * map(p + k.xyy * h, e).x + k.yyx * map(p + k.yyx * h, e).x +
                   k.yxy * map(p + k.yxy * h, e).x + k.xxx * map(p + k.xxx * h, e).x);
}

float shadow(vec3 ro, vec3 rd) {
  float res = 1.0, t = 0.02, e;
  for (int i = 0; i < 40; i++) {
    float h = map(ro + rd * t, e).x;
    res = min(res, 10.0 * h / t);
    t += clamp(h, 0.01, 0.2);
    if (res < 0.003 || t > 5.0) break;
  }
  return clamp(res, 0.0, 1.0);
}

float occlusion(vec3 p, vec3 n) {
  float o = 0.0, s = 1.0, e;
  for (int i = 0; i < 5; i++) {
    float h = 0.012 + 0.06 * float(i);
    o += (h - map(p + n * h, e).x) * s;
    s *= 0.8;
  }
  return clamp(1.0 - 2.5 * o, 0.0, 1.0);
}

vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }

void main() {
  vec2 uv = (2.0 * gl_FragCoord.xy - uRes) / uRes.y;
  vec3 cw = normalize(uTarget - uCam), cu = normalize(cross(cw, vec3(0, 1, 0))), cv = cross(cu, cw);
  vec3 rd = normalize(uv.x * cu + uv.y * cv + cw / tan(uFov * 0.5));
  vec3 ro = uCam;

  float t = 0.5, glow = 0.0, eye;
  vec2 hit = vec2(-1.0);
  for (int i = 0; i < 220; i++) {
    vec3 p = ro + rd * t;
    vec2 h = map(p, eye);
    glow += 0.0012 / (0.0012 + eye * eye) * 0.02;
    if (h.x < 0.0004 * t) { hit = vec2(t, h.y); break; }
    t += h.x * 0.85;
    if (t > 30.0) break;
  }

  vec3 glowColor = mix(vec3(1.0, 0.25, 0.08), vec3(1.0, 0.55, 0.2), uRoar) * glow * mix(0.8, 1.6, uRoar);
  if (hit.x < 0.0) {
    float a = clamp(length(glowColor) * 0.8, 0.0, 1.0);
    frag = vec4(aces(glowColor) / max(a, 0.001) * a, a);
    return;
  }

  vec3 p = ro + rd * hit.x;
  vec3 n = normalAt(p);
  float ao = occlusion(p, n);
  float m = hit.y;

  vec3 albedo = vec3(0.29, 0.285, 0.275) * (0.8 + 0.35 * noise(p * 7.0)) * (0.9 + 0.15 * noise(p * 60.0));
  // Bruised, bloodless patches and dark veins
  albedo = mix(albedo, vec3(0.2, 0.17, 0.18), smoothstep(0.55, 0.8, noise(p * 3.0 + 4.0)) * 0.7);
  float spec = 0.18;
  if (m == 2.0) { albedo = vec3(0.6, 0.55, 0.42) * (0.8 + 0.4 * noise(p * 80.0)); spec = 0.4; }
  if (m == 4.0) { albedo = vec3(0.07, 0.015, 0.015); spec = 0.05; }
  if (m == 5.0) { albedo = vec3(0.025, 0.02, 0.02); spec = 0.0; }

  vec3 v = -rd;
  vec3 key = normalize(vec3(-0.45, 0.85, 0.55));
  float dif = clamp((dot(n, key) + 0.1) / 1.1, 0.0, 1.0) * shadow(p + n * 0.002, key);
  vec3 hv = normalize(key + v);
  float sp = pow(clamp(dot(n, hv), 0.0, 1.0), 40.0) * spec * dif;
  float fres = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 3.0);
  vec3 rimDir = normalize(vec3(0.7, 0.25, -0.65));
  float rim = clamp(dot(n, rimDir) + 0.35, 0.0, 1.0) * (0.25 + fres);
  float under = clamp(dot(n, normalize(vec3(0.0, -0.7, 0.7))), 0.0, 1.0);

  vec3 col = albedo * (vec3(0.85, 0.92, 1.05) * 1.55 * dif + vec3(0.06, 0.07, 0.1) * ao + vec3(0.6, 0.2, 0.12) * 0.7 * under * ao);
  col += vec3(1.0, 0.16, 0.06) * rim * 1.8 * ao;
  col += vec3(1.0) * sp;
  if (m == 3.0) col = mix(vec3(3.2, 0.7, 0.2), vec3(4.0, 1.6, 0.6), uRoar);
  col += glowColor;
  frag = vec4(aces(col), 1.0);
}`;

const VERT = `#version 300 es
in vec2 pos; void main() { gl_Position = vec4(pos, 0.0, 1.0); }`;

const canvas = document.getElementById('c');
const gl = canvas.getContext('webgl2', { premultipliedAlpha: false, preserveDrawingBuffer: true, alpha: true });
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
const prog = gl.createProgram();
gl.attachShader(prog, compile(gl.VERTEX_SHADER, VERT));
gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, FRAG));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'pos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

// Render in small tiles so no single draw call runs long enough to trip the GPU watchdog
window.renderSdf = async (opts) => {
  const { w, h, scale, cam, target, fov, roar, tilt, pose = 0 } = opts;
  const W = w * scale, H = h * scale;
  canvas.width = W; canvas.height = H;
  gl.viewport(0, 0, W, H);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U('uRes'), W, H);
  gl.uniform3f(U('uCam'), ...cam);
  gl.uniform3f(U('uTarget'), ...target);
  gl.uniform1f(U('uFov'), fov * Math.PI / 180);
  gl.uniform1f(U('uRoar'), roar);
  gl.uniform1f(U('uTilt'), tilt);
  gl.uniform1f(U('uPose'), pose);
  gl.enable(gl.SCISSOR_TEST);
  const T = 64;
  for (let y = 0; y < H; y += T) {
    for (let x = 0; x < W; x += T) {
      gl.scissor(x, y, T, T);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
      gl.finish();
    }
    await new Promise(r => setTimeout(r, 0));
  }
  gl.disable(gl.SCISSOR_TEST);
  const pixels = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  // Flip, then downscale for clean edges
  const big = document.createElement('canvas'); big.width = W; big.height = H;
  const bg = big.getContext('2d');
  const img = bg.createImageData(W, H);
  for (let row = 0; row < H; row++) img.data.set(pixels.subarray((H - 1 - row) * W * 4, (H - row) * W * 4), row * W * 4);
  bg.putImageData(img, 0, 0);
  const out = document.createElement('canvas'); out.width = w; out.height = h;
  const og = out.getContext('2d');
  og.imageSmoothingEnabled = true; og.imageSmoothingQuality = 'high';
  og.drawImage(big, 0, 0, w, h);
  return out.toDataURL('image/png');
};

// Where a world point lands in the picture (0..1, y up), for the fight's hit test
window.projectPoint = (opts, p) => {
  const { w, h, cam, target, fov } = opts;
  const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
  const norm = a => { const l = Math.hypot(...a); return a.map(v => v / l); };
  const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
  const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
  const cw = norm(sub(target, cam)), cu = norm(cross(cw, [0, 1, 0])), cv = cross(cu, cw);
  const d = sub(p, cam);
  const fl = 1 / Math.tan(fov * Math.PI / 360);
  const z = dot(d, cw);
  const ux = dot(d, cu) / z * fl, uy = dot(d, cv) / z * fl;
  return [(ux * h / w + 1) / 2, (uy + 1) / 2];
};
window.ready = true;
</script>
</body>
</html>
