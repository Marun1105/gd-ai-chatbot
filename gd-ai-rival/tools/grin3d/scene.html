<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';

// ---------- helpers ----------
// Front-view 2D point (x, y inside the unit circle) projected onto the head sphere
function onHead(x, y, lift = 0) {
  const z = Math.sqrt(Math.max(0, 1 - x * x - y * y));
  return new THREE.Vector3(x, y, z).normalize().multiplyScalar(1 + lift);
}

function glowTexture(inner, outer) {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, inner);
  grad.addColorStop(1, outer);
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}

// A patch of the head between two curves (top(t), bottom(t)) over x(t), with
// colours darkening towards the inside for depth
function headPatch(xAt, topAt, botAt, lift, edgeColor, coreColor, n = 48, m = 10) {
  const pos = [], col = [], idx = [];
  const e = new THREE.Color(edgeColor), c = new THREE.Color(coreColor), tmp = new THREE.Color();
  for (let i = 0; i <= n; i++) {
    const t = -1 + 2 * i / n;
    for (let j = 0; j <= m; j++) {
      const s = j / m;
      const x = xAt(t), y = topAt(t) + (botAt(t) - topAt(t)) * s;
      const p = onHead(x, y, lift);
      pos.push(p.x, p.y, p.z);
      // 0 at the rim, 1 deep inside
      const depth = Math.min(1, Math.sin(Math.PI * s) * (1 - Math.abs(t) * 0.6) * 1.6);
      tmp.copy(e).lerp(c, depth);
      col.push(tmp.r, tmp.g, tmp.b);
    }
  }
  for (let i = 0; i < n; i++) for (let j = 0; j < m; j++) {
    const a = i * (m + 1) + j, b = a + m + 1;
    idx.push(a, b, a + 1, b, b + 1, a + 1);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return new THREE.Mesh(g, new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.95, metalness: 0, side: THREE.DoubleSide }));
}

function ellipsePatch(cx, cy, rx, ry, tilt, lift, edge, core) {
  const cos = Math.cos(tilt), sin = Math.sin(tilt);
  const xAt = t => cx + (t * rx) * cos;
  // Upper and lower halves of the ellipse at each t
  const half = t => ry * Math.sqrt(Math.max(0, 1 - t * t));
  const topAt = t => cy + half(t) + (t * rx) * sin;
  const botAt = t => cy - half(t) + (t * rx) * sin;
  return headPatch(xAt, topAt, botAt, lift, edge, core, 40, 12);
}

function tube(points, radius, material, segments = 40) {
  const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(...p)));
  return new THREE.Mesh(new THREE.TubeGeometry(curve, segments, radius, 12, false), material);
}

// ---------- the creature ----------
function buildGrin({ roar = false } = {}) {
  const root = new THREE.Group();
  const head = new THREE.Group();
  head.position.set(0, 1.6, 0);
  root.add(head);

  // Sickly yellow, darker towards the edges and underneath (baked grime)
  const sphere = new THREE.SphereGeometry(1, 128, 96);
  const sc = [], n = sphere.attributes.normal, base = new THREE.Color(0xe9b81c), dark = new THREE.Color(0x4a3004), tmp = new THREE.Color();
  for (let i = 0; i < n.count; i++) {
    const front = n.getZ(i), up = n.getY(i);
    const light = Math.min(1, Math.max(0, 0.42 + front * 0.45 + up * 0.18));
    const grime = 0.9 + 0.1 * Math.sin(n.getX(i) * 23.0 + n.getY(i) * 17.0) * Math.sin(n.getY(i) * 31.0);
    tmp.copy(dark).lerp(base, light * grime);
    sc.push(tmp.r, tmp.g, tmp.b);
  }
  sphere.setAttribute('color', new THREE.Float32BufferAttribute(sc, 3));
  const skin = new THREE.MeshPhysicalMaterial({ vertexColors: true, roughness: 0.4, clearcoat: 0.45, clearcoatRoughness: 0.35 });
  const ball = new THREE.Mesh(sphere, skin);
  head.add(ball);
  // Creepy tilt
  head.rotation.z = -0.16;
  head.rotation.x = 0.08;

  // The grin: far too wide, deeper when roaring
  const width = roar ? 0.76 : 0.72;
  const top = t => (roar ? -0.08 : -0.16) + (roar ? 0.17 : 0.21) * t * t;
  const bottom = t => (roar ? -0.08 : -0.16) - (roar ? 0.6 : 0.4) * (1 - t * t) + (roar ? 0.17 : 0.21) * t * t;
  const xAt = t => width * t;
  head.add(headPatch(xAt, top, bottom, 0.004, 0x2a0606, 0x000000, 60, 14));

  // Teeth along both lips, pointing into the mouth along the surface
  const toothMat = new THREE.MeshStandardMaterial({ color: 0xf1ead2, roughness: 0.28 });
  const teeth = roar ? 15 : 17;
  for (let k = 0; k < teeth; k++) {
    const t = -0.92 + 1.84 * (k + 0.5) / teeth;
    for (const lip of ['top', 'bottom']) {
      if (lip === 'bottom' && Math.abs(t) > 0.82) continue;
      const y = lip === 'top' ? top(t) : bottom(t);
      const inward = lip === 'top' ? -1 : 1;
      const len = (roar ? 0.15 : 0.11) * (1 - Math.abs(t) * 0.45) * (lip === 'top' ? 1 : 0.8);
      const base = onHead(xAt(t), y, 0.006);
      const tip = onHead(xAt(t), y + inward * len, 0.01);
      const dir = tip.clone().sub(base);
      const cone = new THREE.Mesh(new THREE.ConeGeometry(0.034 + Math.random() * 0.01, dir.length(), 10), toothMat);
      cone.position.copy(base.clone().add(tip).multiplyScalar(0.5));
      cone.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.normalize());
      head.add(cone);
    }
  }

  // Hollow eyes tilted into a glare, with burning pupils
  const pupilMat = new THREE.MeshStandardMaterial({ color: 0xff2a14, emissive: 0xff1a0a, emissiveIntensity: 6 });
  const glow = glowTexture('rgba(255,40,20,0.95)', 'rgba(255,0,0,0)');
  for (const side of [-1, 1]) {
    const cx = side * 0.33, cy = roar ? 0.25 : 0.22;
    head.add(ellipsePatch(cx, cy, 0.17, roar ? 0.2 : 0.26, side * -0.25, 0.004, 0x1a0c08, 0x000000));
    const p = onHead(cx + side * -0.02, cy - 0.06, 0.012);
    const pupil = new THREE.Mesh(new THREE.SphereGeometry(roar ? 0.042 : 0.034, 16, 12), pupilMat);
    pupil.position.copy(p);
    head.add(pupil);
    const halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: glow, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true }));
    halo.position.copy(onHead(cx + side * -0.02, cy - 0.06, 0.05));
    halo.scale.setScalar(roar ? 0.26 : 0.18);
    head.add(halo);
    // Heavy brow, outer end high, inner end low
    const brow = [[side * 0.62, 0.62], [side * 0.4, 0.5], [side * 0.16, 0.34]].map(([x, y]) => {
      const v = onHead(x, y, 0.025);
      return [v.x, v.y, v.z];
    });
    head.add(tube(brow, 0.062, new THREE.MeshStandardMaterial({ color: 0x120d0a, roughness: 0.75 }), 24));
  }

  // Thin, hunched, too-long body
  const body = new THREE.MeshStandardMaterial({ color: 0x26242b, roughness: 0.58, metalness: 0.05 });
  const torso = new THREE.Mesh(new THREE.CapsuleGeometry(0.27, 0.75, 8, 20), body);
  torso.position.set(0, 0.05, -0.05);
  torso.rotation.x = 0.28;
  root.add(torso);
  root.add(tube([[0, 0.45, 0], [0, 0.62, 0.02], [0, 0.72, 0.03]], 0.11, body, 8));

  const clawMat = new THREE.MeshStandardMaterial({ color: 0xd9ceb0, roughness: 0.35 });
  for (const side of [-1, 1]) {
    const s = side;
    // Arms raised to shoulder height, reaching at you
    const wrist = [s * 1.05, 0.95, 0.85];
    root.add(tube([[s * 0.3, 0.42, 0.02], [s * 0.78, 0.18, 0.3], [s * 0.98, 0.6, 0.65], wrist], 0.058, body));
    const hand = new THREE.Mesh(new THREE.SphereGeometry(0.11, 20, 16), body);
    hand.position.set(...wrist);
    root.add(hand);
    for (let f = 0; f < 4; f++) {
      const spread = (f - 1.5) * 0.11;
      const a = [wrist[0] + s * 0.04 + spread * 0.4, wrist[1] + 0.05 + spread, wrist[2] + 0.05];
      const b = [a[0] + s * 0.05, a[1] + 0.12, a[2] + 0.2];
      const c = [b[0] + s * 0.02, b[1] + 0.02, b[2] + 0.18];
      root.add(tube([a, b, c], 0.022, body, 12));
      const dir = new THREE.Vector3(c[0] - b[0], c[1] - b[1], c[2] - b[2]).normalize();
      const claw = new THREE.Mesh(new THREE.ConeGeometry(0.024, 0.2, 8), clawMat);
      claw.position.set(c[0] + dir.x * 0.1, c[1] + dir.y * 0.1, c[2] + dir.z * 0.1);
      claw.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir);
      root.add(claw);
    }
    // Bent legs
    root.add(tube([[s * 0.14, -0.38, 0], [s * 0.36, -0.82, 0.26], [s * 0.3, -1.32, 0.05]], 0.07, body, 20));
    const foot = new THREE.Mesh(new THREE.SphereGeometry(0.12, 16, 12), body);
    foot.scale.set(1, 0.45, 1.6);
    foot.position.set(s * 0.3, -1.36, 0.14);
    root.add(foot);
  }
  return root;
}

// ---------- rendering ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

function lights(scene, angry) {
  scene.add(new THREE.HemisphereLight(0x7080a0, 0x100604, angry ? 0.25 : 0.4));
  const key = new THREE.DirectionalLight(0xfff2dc, angry ? 1.5 : 2.2);
  key.position.set(-2.5, 4.5, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xff2a18, angry ? 7 : 5);
  rim.position.set(3.5, 2.5, -4);
  scene.add(rim);
  const rim2 = new THREE.DirectionalLight(0xff6a28, angry ? 3.5 : 2.5);
  rim2.position.set(-3.5, 1.5, -4);
  scene.add(rim2);
  // Horror up-light on the face
  const under = new THREE.PointLight(0xff3a20, angry ? 7 : 3, 7, 1.8);
  under.position.set(0, 0.2, 2.6);
  scene.add(under);
}

window.renderShot = (kind, w, h) => {
  renderer.setSize(w, h);
  const scene = new THREE.Scene();
  const roar = kind === 'roar';
  scene.add(buildGrin({ roar }));
  lights(scene, kind !== 'full');
  let camera;
  if (kind === 'full') {
    camera = new THREE.PerspectiveCamera(34, w / h, 0.1, 100);
    camera.position.set(0, 0.9, 7.6);
    camera.lookAt(0, 0.62, 0);
  } else {
    camera = new THREE.PerspectiveCamera(38, w / h, 0.1, 100);
    camera.position.set(0, 1.25, 3.25);
    camera.lookAt(0, 1.55, 0);
  }
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, camera);
  return renderer.domElement.toDataURL('image/png');
};

// The fight arena: a dark void behind the broken screen
window.renderArena = (w, h) => {
  renderer.setSize(w, h);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x020106);
  scene.fog = new THREE.FogExp2(0x0a0208, 0.03);
  // Glowing grid floor (a texture, so lines going into the distance stay visible)
  const gc = document.createElement('canvas');
  gc.width = gc.height = 256;
  const gx = gc.getContext('2d');
  gx.fillStyle = '#000000';
  gx.fillRect(0, 0, 256, 256);
  gx.shadowColor = '#29e6ff';
  gx.shadowBlur = 18;
  gx.strokeStyle = '#7ff3ff';
  gx.lineWidth = 6;
  gx.strokeRect(3, 3, 250, 250);
  const gridTex = new THREE.CanvasTexture(gc);
  gridTex.wrapS = gridTex.wrapT = THREE.RepeatWrapping;
  gridTex.repeat.set(60, 60);
  gridTex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  gridTex.colorSpace = THREE.SRGBColorSpace;
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(240, 240), new THREE.MeshBasicMaterial({ map: gridTex }));
  floor.rotation.x = -Math.PI / 2;
  floor.position.set(0, -1.6, -60);
  scene.add(floor);
  // Red glow on the horizon
  const horizon = new THREE.Mesh(new THREE.PlaneGeometry(160, 40), new THREE.MeshBasicMaterial({
    map: glowTexture('rgba(255,40,20,0.85)', 'rgba(60,0,0,0)'), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, fog: false,
  }));
  horizon.position.set(0, 2, -70);
  scene.add(horizon);
  // Floating glass shards catching yellow light
  const shardMat = new THREE.MeshStandardMaterial({ color: 0xc8dde8, metalness: 0.6, roughness: 0.12, transparent: true, opacity: 0.6, side: THREE.DoubleSide, emissive: 0x2a2010 });
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  for (let i = 0; i < 70; i++) {
    const g = new THREE.BufferGeometry();
    const size = 0.3 + rnd() * 1.4;
    const pts = [0, 0, 0, size * (0.4 + rnd()), size * (rnd() - 0.2), 0, size * (rnd() - 0.5), size * (0.5 + rnd()), 0];
    g.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    g.computeVertexNormals();
    const m = new THREE.Mesh(g, shardMat);
    const side = rnd() < 0.5 ? -1 : 1;
    m.position.set(side * (2.5 + rnd() * 14), -1 + rnd() * 7, -3 - rnd() * 40);
    m.rotation.set(rnd() * 6, rnd() * 6, rnd() * 6);
    scene.add(m);
  }
  const warm = new THREE.PointLight(0xffc840, 160, 40, 1.3);
  warm.position.set(0, 4, -6);
  scene.add(warm);
  const red = new THREE.PointLight(0xff2010, 80, 80, 1.2);
  red.position.set(0, 1, -40);
  scene.add(red);
  scene.add(new THREE.AmbientLight(0x404060, 0.4));
  // Dust in the air
  const dust = new THREE.BufferGeometry();
  const dp = [];
  for (let i = 0; i < 900; i++) dp.push((rnd() - 0.5) * 50, -1.5 + rnd() * 12, -rnd() * 60);
  dust.setAttribute('position', new THREE.Float32BufferAttribute(dp, 3));
  scene.add(new THREE.Points(dust, new THREE.PointsMaterial({ color: 0xffe0a0, size: 0.06, transparent: true, opacity: 0.7 })));

  const camera = new THREE.PerspectiveCamera(62, w / h, 0.1, 300);
  camera.position.set(0, 0.6, 6);
  camera.lookAt(0, 0.9, -10);
  renderer.setClearColor(0x000000, 1);
  renderer.render(scene, camera);

  // Vignette and faint scanlines on top
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const g = out.getContext('2d');
  g.drawImage(renderer.domElement, 0, 0);
  const v = g.createRadialGradient(w / 2, h / 2, h * 0.35, w / 2, h / 2, w * 0.7);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.75)');
  g.fillStyle = v;
  g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(0,0,0,0.08)';
  for (let y = 0; y < h; y += 3) g.fillRect(0, y, w, 1);
  return out.toDataURL('image/jpeg', 0.86);
};
window.ready = true;
</script>
