<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>html,body{margin:0;background:transparent}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head>
<body>
<script type="module">
// Renders the CC0 "3D Horror Game Monster" by HorrorGameMaker.com
// (opengameart.org/content/3d-horror-game-monster) as Grin. Expects the
// model's FBX files in oga/ and its skin textures in oga/tex-<skin>/.
import * as THREE from 'three';
import { FBXLoader } from 'three/addons/loaders/FBXLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const texLoader = new THREE.TextureLoader();
const loadTex = url => new Promise((ok, fail) => texLoader.load(url, ok, undefined, fail));

// Unity's metallic/smoothness map keeps smoothness in alpha; three wants
// roughness in green
async function roughnessFrom(url) {
  const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
  const size = 1024;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, size, size);
  const data = g.getImageData(0, 0, size, size);
  for (let i = 0; i < data.data.length; i += 4) {
    const rough = 255 - data.data[i + 3];
    data.data[i] = data.data[i + 1] = data.data[i + 2] = rough;
    data.data[i + 3] = 255;
  }
  g.putImageData(data, 0, 0);
  return new THREE.CanvasTexture(c);
}

let model = null, mixer = null, clips = [];

// Recolor the skin: 'charcoal' (near-black), 'ash' (pale sickly yellow)
async function tinted(url, tint) {
  const img = await new Promise((ok, fail) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fail; i.src = url; });
  const size = 2048;
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d');
  g.drawImage(img, 0, 0, size, size);
  const data = g.getImageData(0, 0, size, size);
  const d = data.data;
  for (let i = 0; i < d.length; i += 4) {
    const r = d[i], gr = d[i + 1], b = d[i + 2];
    const lum = 0.3 * r + 0.59 * gr + 0.11 * b;
    // How much brighter than its own red the pixel is: teeth and claws
    const pale = Math.min(1, Math.max(0, (gr - r * 0.55) / 60));
    if (tint === 'charcoal') {
      const v = lum * 0.55;
      d[i] = v * 1.05 + pale * 90; d[i + 1] = v * 0.95 + pale * 85; d[i + 2] = v * 0.92 + pale * 70;
    } else if (tint === 'ash') {
      const v = Math.min(255, lum * 1.9 + 20);
      d[i] = v * 1.0; d[i + 1] = v * 0.9; d[i + 2] = v * 0.55;
    }
  }
  g.putImageData(data, 0, 0);
  const t = new THREE.CanvasTexture(c);
  t.flipY = true;
  return t;
}

window.loadModel = async (file, skin, tint = 'none') => {
  const loader = new FBXLoader();
  const obj = await new Promise((ok, fail) => loader.load(`oga/${file}`, ok, undefined, fail));
  const dir = `oga/tex-${skin}/test_StingrayPBS1SG_`;
  const albedo = tint === 'none' ? await loadTex(dir + 'AlbedoTransparency.png') : await tinted(dir + 'AlbedoTransparency.png', tint);
  albedo.colorSpace = THREE.SRGBColorSpace;
  albedo.anisotropy = 8;
  const normal = await loadTex(dir + 'Normal.png');
  const rough = await roughnessFrom(dir + 'MetallicSmoothness.png');
  const meshes = [];
  obj.traverse(o => {
    if (o.isMesh) {
      o.material = new THREE.MeshStandardMaterial({ map: albedo, normalMap: normal, roughnessMap: rough, roughness: 1, metalness: 0 });
      o.frustumCulled = false;
      meshes.push(o.name);
    }
  });
  const bones = [];
  obj.traverse(o => { if (o.isBone) bones.push(o.name); });
  model = obj;
  clips = obj.animations;
  mixer = new THREE.AnimationMixer(obj);
  const box = new THREE.Box3().setFromObject(obj);
  return { meshes, bones, clips: clips.map(c => [c.name, c.duration]), box: [box.min.toArray(), box.max.toArray()] };
};

function lights(scene, strength, red = 1) {
  scene.add(new THREE.HemisphereLight(0x8090b0, 0x0a0606, 0.35 * strength));
  const key = new THREE.DirectionalLight(0xdfe6ff, 2.2 * strength);
  key.position.set(-2, 5, 4);
  scene.add(key);
  const rim = new THREE.DirectionalLight(0xff2a18, 5 * strength * red);
  rim.position.set(3.5, 2.5, -4);
  scene.add(rim);
  const rim2 = new THREE.DirectionalLight(0xff6a30, 2 * strength * red);
  rim2.position.set(-3.5, 1, -3);
  scene.add(rim2);
  const under = new THREE.PointLight(0xff5030, 3 * strength * red, 0, 0);
  under.position.set(0, -0.5, 3);
  scene.add(under);
}

// Pose the model at a moment of one of its clips, framed by a box of the
// model's height (0 = feet, 1 = top of the head)
window.renderFrame = ({ clip = 0, time = 0, w, h, look = [0, 0.5], dist = 2.6, yaw = 0, pitch = 0, fov = 30, exposure = 1, red = 1, focus = null, jaw = 0, jawAxis = "x" }) => {
  renderer.setSize(w, h);
  renderer.toneMappingExposure = exposure;
  const scene = new THREE.Scene();
  if (clips.length) {
    mixer.stopAllAction();
    const action = mixer.clipAction(clips[clip]);
    action.reset().play();
    mixer.setTime(time);
  }
  // The clips may not key the jaw, so start every frame from its rest angle
  model.traverse(o => {
    if (!o.isBone || o.name !== 'Jaw') return;
    if (!o.userData.rest) o.userData.rest = o.rotation.clone();
    else if (!clips.length || !o.userData.keyed) o.rotation.copy(o.userData.rest);
    o.rotation[jawAxis] += jaw;
  });
  scene.add(model);
  model.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(model);
  const height = box.max.y - box.min.y;
  const center = new THREE.Vector3((box.min.x + box.max.x) / 2, box.min.y + height * look[1], (box.min.z + box.max.z) / 2);
  center.x += look[0] * height;
  if (focus !== null) {
    // Aim at one bone (by its traverse index), offset in model heights
    let n = 0;
    model.traverse(o => { if (o.isBone && n++ === focus) center.setFromMatrixPosition(o.matrixWorld); });
    center.x += look[0] * height;
    center.y += (look[1] - 0.5) * height;
  }
  const camera = new THREE.PerspectiveCamera(fov, w / h, height * 0.01, height * 50);
  const d = dist * height;
  camera.position.set(center.x + Math.sin(yaw) * d * Math.cos(pitch), center.y + Math.sin(pitch) * d, center.z + Math.cos(yaw) * d * Math.cos(pitch));
  camera.lookAt(center);
  lights(scene, 1, red);
  // Lights are in model-height units
  scene.traverse(o => { if (o.isLight && o.position) o.position.multiplyScalar(height / 2).add(center); });
  renderer.setClearColor(0x000000, 0);
  renderer.render(scene, camera);
  scene.remove(model);
  // Where each bone lands on the image (0..1, y down), for the fight's hit test
  const points = {};
  let n = 0;
  model.traverse(o => {
    if (!o.isBone) return;
    const p = new THREE.Vector3().setFromMatrixPosition(o.matrixWorld).project(camera);
    points[`${o.name}#${n++}`] = [+((p.x + 1) / 2).toFixed(3), +((1 - p.y) / 2).toFixed(3)];
  });
  return { url: renderer.domElement.toDataURL('image/png'), points };
};
window.ready = true;
</script>
</body>
</html>
